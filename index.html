<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos 7 Erros - Supermercado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        canvas {
            touch-action: none;
        }
        .pulse-marker {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-2 md:p-6 font-sans">

    <!-- Cabeçalho -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-4 mb-3 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
                🔍 Jogo dos 7 Erros
            </h1>
            <p class="text-xs md:text-sm text-slate-400">Encontre as 7 diferenças na Imagem 2 (lado direito) ou desenhe livremente!</p>
        </div>
        
        <!-- Placar e Ações -->
        <div class="flex items-center gap-3">
            <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 flex items-center gap-3">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Erros:</span>
                <span id="score" class="text-2xl font-black text-green-400">0 / 7</span>
            </div>
            <button id="btnHint" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-3.5 rounded-lg shadow flex items-center gap-2 transition active:scale-95 text-sm">
                <i class="fa-solid fa-lightbulb"></i> Dica
            </button>
            <button id="btnReset" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 px-3.5 rounded-lg shadow flex items-center gap-2 transition active:scale-95 text-sm">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar
            </button>
        </div>
    </header>

    <!-- Barra de Ferramentas / Carregar Imagem -->
    <div class="w-full max-w-5xl bg-slate-800 p-3 rounded-xl mb-3 border border-slate-700 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400 font-bold uppercase ml-1">Modo:</span>
            <button id="modeClick" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-indigo-600 text-white shadow transition">
                <i class="fa-solid fa-hand-pointer"></i> Clique / Marcação
            </button>
            <button id="modeDraw" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
                <i class="fa-solid fa-paintbrush"></i> Desenho Livre
            </button>
        </div>

        <!-- Controles do Pincel -->
        <div id="drawControls" class="hidden flex items-center gap-3 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
            <div class="flex items-center gap-2">
                <label for="brushColor" class="text-xs text-slate-400">Cor:</label>
                <input type="color" id="brushColor" value="#ef4444" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent">
            </div>
            <div class="flex items-center gap-2">
                <label for="brushSize" class="text-xs text-slate-400">Tamanho:</label>
                <input type="range" id="brushSize" min="2" max="25" value="6" class="w-20 accent-indigo-500">
            </div>
            <button id="btnClearCanvas" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-600 transition">
                <i class="fa-solid fa-eraser"></i> Limpar Desenhos
            </button>
        </div>

        <!-- Botão para carregar foto da galeria -->
        <div>
            <label for="uploadImage" class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 px-3 rounded-lg border border-slate-600 flex items-center gap-2 transition">
                <i class="fa-solid fa-upload"></i> Usar Imagem da Galeria
            </label>
            <input type="file" id="uploadImage" accept="image/*" class="hidden">
        </div>
    </div>

    <!-- Contentor Principal da Imagem + Jogo -->
    <main class="w-full max-w-5xl relative flex justify-center items-center overflow-hidden rounded-xl border-2 border-slate-700 shadow-2xl bg-black min-h-[400px]">
        <div id="gameContainer" class="relative w-full max-w-4xl mx-auto overflow-hidden rounded-xl border-2 border-slate-700 shadow-2xl bg-slate-800 p-4">
    <!-- Imagem Principal -->
    <img src="https://i.im.ge/QMz50yY/378d4322-bb49-49a1-a53e-ae9b1ae5053ca.jpg" alt="Jogo dos 7 erros" class="w-full h-full cursor-pointer z-10">
    <!-- Camada de Desenho Canvas -->
    <canvas id="paintCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-20"></canvas>
    <!-- Marcadores dos Erros Encontrados -->
    <div id="markersContainer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-20"></div>
</div>

        </div>
    </main>

    <!-- Modal de Vitória -->
    <div id="victoryModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 md:p-8 rounded-2xl max-w-md w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl border border-green-500/50">
                🏆
            </div>
            <h2 class="text-3xl font-black text-white mb-2">Parabéns!</h2>
            <p class="text-slate-300 mb-6">Encontrou com sucesso todos os 7 erros do supermercado!</p>
            <button id="btnPlayAgain" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                Jogar Novamente

        </div>
    </div>

    <!-- Notificação Toast -->

                    <text x="400" y="105" fill="#fff" font-size="14" font-weight="bold" transform="rotate(-11 400 105)">BEBIDAS</text>

                    <line x1="0" y1="250" x2="180" y2="280" stroke="#94a3b8" stroke-width="4"/>
                    <line x1="0" y1="360" x2="180" y2="370" stroke="#94a3b8" stroke-width="4"/>
                    <line x1="0" y1="470" x2="180" y2="460" stroke="#94a3b8" stroke-width="4"/>

                    <!-- Produtos Esquerda -->

                    <!-- Espaço em falta -->

                    <!-- ERRO 4: Carrinho no lado DIREITO cheio de compras -->

                        <rect x="0" y="0" width="95" height="65" fill="#38bdf8" opacity="0.3" stroke="#0284c7" stroke-width="3" rx="5"/>
                        <!-- Produtos dentro -->
                        <rect x="10" y="-15" width="20" height="30" fill="#ef4444" rx="2"/>
                        <rect x="35" y="-20" width="25" height="35" fill="#f59e0b" rx="2"/>

        }

        // Tentar carregar imagem enviada
        function initImage() {
            gameImage.onerror = () => {
                // Se a imagem externa não carregar por restrição de URL, usa a imagem vetorial gerada
                gameImage.src = generateDefaultSupermarketImage();
            };

            // URL enviada
            gameImage.src = 'uploaded:image.png-2ad20b21-617a-4c36-bb21-379b11810e9b';
        }

        initImage();

        // Carregar imagem personalizada da galeria caso o utilizador prefira
        uploadImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    gameImage.src = event.target.result;
                    resetGame();
                    showToast('Imagem carregada com sucesso!');
                };
                reader.readAsDataURL(file);
            }
        });

        // Redimensionar Canvas
        function resizeCanvas() {
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        gameImage.addEventListener('load', resizeCanvas);

        // Troca de Modos
        modeClick.addEventListener('click', () => {
            currentMode = 'click';
            modeClick.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-indigo-600 text-white shadow transition';
            modeDraw.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
            drawControls.classList.add('hidden');
            canvas.style.cursor = 'pointer';
        });

        modeDraw.addEventListener('click', () => {
            currentMode = 'draw';
            modeDraw.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-indigo-600 text-white shadow transition';
            modeClick.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
            drawControls.classList.remove('hidden');
            canvas.style.cursor = 'crosshair';
        });

        // Função de Desenho Livre
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            if (currentMode !== 'draw') return;
            isDrawing = true;
            const pos = getCoords(e);
            lastX = pos.x;
            lastY = pos.y;
        }

        function draw(e) {
            if (!isDrawing || currentMode !== 'draw') return;
            e.preventDefault();
            const pos = getCoords(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = brushColor.value;
            ctx.lineWidth = brushSize.value;
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        btnClearCanvas.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            showToast('Desenho limpo!');
        });

        // Identificação de Erros por Clique
        canvas.addEventListener('click', (e) => {
            if (currentMode !== 'click') return;

            const rect = canvas.getBoundingClientRect();
            const clickXPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const clickYPercent = ((e.clientY - rect.top) / rect.height) * 100;

            if (clickXPercent < 50) {
                showToast('👉 Encontre os erros no lado DIREITO (Imagem 2)!');
                return;
            }

            let hitFound = false;

            ERRORS.forEach((error) => {
                if (foundErrors.has(error.id)) return;

                const dx = clickXPercent - error.x;
                const dy = clickYPercent - error.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance <= error.radius) {
                    hitFound = true;
                    foundErrors.add(error.id);
                    renderMarker(error);
                    updateScore();
                    showToast(`✅ Encontrou: ${error.name}!`);

                    if (foundErrors.size === ERRORS.length) {
                        setTimeout(() => victoryModal.classList.remove('hidden'), 500);
                    }
                }
            });

            if (!hitFound) {
                showFeedbackCircle(clickXPercent, clickYPercent, false);
            }
        });

        // Desenhar Marcador de Erro Encontrado
        function renderMarker(error) {
            const marker = document.createElement('div');
            marker.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 border-4 border-green-400 rounded-full pulse-marker flex items-center justify-center bg-green-500/20 shadow-lg';
            marker.style.left = `${error.x}%`;
            marker.style.top = `${error.y}%`;
            marker.style.width = `${error.radius * 2.2}%`;
            marker.style.height = `${error.radius * 3.2}%`;

            const check = document.createElement('i');
            check.className = 'fa-solid fa-check text-green-400 text-lg md:text-2xl drop-shadow';
            marker.appendChild(check);

            markersContainer.appendChild(marker);
        }

        // Animação de erro ao clicar em local errado
        function showFeedbackCircle(x, y, isCorrect) {
            const circle = document.createElement('div');
            circle.className = `absolute rounded-full border-2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-all duration-500 scale-100 opacity-100 ${
                isCorrect ? 'border-green-400 bg-green-500/30' : 'border-rose-500 bg-rose-500/30'
            }`;
            circle.style.left = `${x}%`;
            circle.style.top = `${y}%`;
            circle.style.width = '32px';
            circle.style.height = '32px';

            markersContainer.appendChild(circle);

            setTimeout(() => {
                circle.style.transform = 'translate(-50%, -50%) scale(1.6)';
                circle.style.opacity = '0';
            }, 50);

            setTimeout(() => circle.remove(), 550);
        }

        function updateScore() {
            scoreEl.textContent = `${foundErrors.size} / ${ERRORS.length}`;
        }

        // Botão Dica
        btnHint.addEventListener('click', () => {
            const remaining = ERRORS.filter(e => !foundErrors.has(e.id));
            if (remaining.length === 0) {
                showToast('Já encontrou todos os erros!');
                return;
            }

            const hint = remaining[Math.floor(Math.random() * remaining.length)];
            
            const hintMarker = document.createElement('div');
            hintMarker.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 border-4 border-amber-400 rounded-full animate-ping pointer-events-none z-30';
            hintMarker.style.left = `${hint.x}%`;
            hintMarker.style.top = `${hint.y}%`;
            hintMarker.style.width = '60px';
            hintMarker.style.height = '60px';

            markersContainer.appendChild(hintMarker);
            showToast(`💡 Veja a área a piscar a amarelo!`);

            setTimeout(() => hintMarker.remove(), 2500);
        });

        // Reiniciar Jogo
        function resetGame() {
            foundErrors.clear();
            markersContainer.innerHTML = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateScore();
            victoryModal.classList.add('hidden');
            showToast('Jogo reiniciado!');
        }

        btnReset.addEventListener('click', resetGame);
        btnPlayAgain.addEventListener('click', resetGame);

        let toastTimeout;
        function showToast(message) {
            toastText.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
